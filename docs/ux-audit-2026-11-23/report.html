<title>تقرير تجربة تسعيرك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@600;700&display=swap">
<style>
/* layout: a working audit board — summary first, then a filterable list of findings */
:root{--bg:#F6F4EF;--surface:#FFFFFF;--fg:#0B2438;--muted:#5B6B7C;--line:#E3DED3;--gold:#D4A543;--gold-ink:#8F6820;
--crit:#B42318;--high:#C2410C;--med:#A16207;--low:#4B6A88;--chip:#EFEAE0;
--display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071827;--surface:#0E2236;--fg:#EEF2F6;--muted:#A3B1C0;--line:#1F3850;--gold:#F5C55B;--gold-ink:#F5C55B;--crit:#F97066;--high:#FB923C;--med:#FACC15;--low:#93B4D4;--chip:#15304A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071827;--surface:#0E2236;--fg:#EEF2F6;--muted:#A3B1C0;--line:#1F3850;--gold:#F5C55B;--gold-ink:#F5C55B;--crit:#F97066;--high:#FB923C;--med:#FACC15;--low:#93B4D4;--chip:#15304A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:22px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(24px,5vw,34px)} h2{font-size:20px}
.lead{color:var(--muted);margin:6px 0 0;max-width:70ch}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start;min-width:0}
.score b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;color:var(--gold-ink)}
.score .p{font-weight:700} .score .v{color:var(--muted);font-size:13px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
ol,ul{margin:8px 0 0;padding-inline-start:22px;display:grid;gap:6px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);font-variant-numeric:tabular-nums}
.s-critical{color:var(--crit);font-weight:700} .s-high{color:var(--high);font-weight:700} .s-medium{color:var(--med);font-weight:700} .s-low{color:var(--low);font-weight:700}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row span.l{font-size:12px;color:var(--muted);min-width:56px}
button.f{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer;min-height:32px}
button.f[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#071827;font-weight:700}
button.f:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input#q{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0)}
.batch{display:grid;gap:2px}
.batch h3{margin:0;font-size:16px;font-family:var(--display)}
.batch p{margin:0;color:var(--muted);font-size:13px}
.items{display:grid;gap:10px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--low);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.item.critical{border-inline-start-color:var(--crit)} .item.high{border-inline-start-color:var(--high)} .item.medium{border-inline-start-color:var(--med)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.meta span{background:var(--chip);border-radius:6px;padding:1px 8px}
.item .scr{font-weight:700}
.item .fix{border-top:1px dashed var(--line);padding-top:6px}
.item .fix b{color:var(--gold-ink)}
.where{font-size:12px;color:var(--muted);direction:ltr;text-align:left;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace}
.empty{color:var(--muted);text-align:center;padding:20px}
.foot{color:var(--muted);font-size:12px}

</style>
<div class="wrap" dir="rtl" lang="ar">
  <header>
    <h1>تقرير تجربة المستخدم في تسعيرك</h1>
    <p class="lead" id="lead"></p>
  </header>
  <section class="scores" id="scores" aria-label="التقييم"></section>
  <section class="box"><h2>أكبر المشكلات</h2><ol id="top"></ol></section>
  <section class="box"><h2>خطة التنفيذ</h2><div id="batches" style="display:grid;gap:12px;margin-top:10px"></div></section>
  <section class="box"><h2>أفكار لإبهار المستخدم</h2><ul id="wow"></ul></section>
  <section>
    <h2>كل الملاحظات</h2>
    <div class="filters">
      <div class="row" id="f-sev"><span class="l">الأهمية</span></div>

      <div class="row" id="f-surf"><span class="l">المكان</span></div>
      <div class="row" id="f-bat"><span class="l">الدفعة</span></div>
      <label for="q" class="sr">بحث في الملاحظات</label>
      <input id="q" type="search" placeholder="ابحث في الملاحظات (مثلاً: صفقة، ضريبة، المورد)">
      <div class="counts" id="shown"></div>
    </div>
    <div class="items" id="items"></div>
  </section>
  <p class="foot" id="foot"></p>
</div>

<script>
const D = {"scores":[{"persona":"home_buyer","score10":6,"verdict":"البداية جذابة وبسيطة (الأقسام المصوّرة، «جهّز بيتك»، الطلب بثلاث خطوات)، لكن بعد الإرسال تعود المصطلحات («أمر شراء»، «RFQ»، القطاعات) والأسماء الإنجليزية والوحدات المختصرة، ويصعب على المشتري فهم خطوتَي التأكيد والصفقة."},{"persona":"contractor","score10":6.5,"verdict":"الميزات أقوى من المنافسين (لصق القائمة، جدول الكميات، العطاء، الاختيار لكل مادة)، لكن صفحات جدول الكميات والعطاء فيها طرق مسدودة، وتضيع فيها البيانات دون تنبيه، ويصعب استخدامها على الجوال."},{"persona":"supplier","score10":5.5,"verdict":"صفحة التسعير غنية، لكن الأخطاء على العرض المُرسل لا تظهر، ووعد التعديل خلال 15 دقيقة غير صحيح، وتلميحات الضريبة متناقضة، وطلبات الخصم شبه مخفية، ودعوة الفريق لا تكتمل، ويُكشف اسم المحل المصدر قبل الصفقة."},{"persona":"app_overall","score10":6,"verdict":"الهوية البصرية متماسكة وأساس التطبيق جيد، لكن فيه شاشات توثيق وبريد لا تكتمل، وشريط عدم الاتصال يغطي الأزرار، ونوافذ تأكيد النظام غير مطابقة للهوية، وأجزاء ناقصة مقارنة بالموقع."}],"top":["الخصوصية: يُكشف اسم المحل المصدر لوسيط التسعير بمجرد اختيار مادة وقبل تأكيد الصفقة، ويظهر هاتف المحل في أمر الشراء القابل للطباعة، وتُنشر أسماء الوسطاء الأفراد وحساب تجريبي «موثّق» في صفحة الموردين العامة.","تعود المصطلحات الإجرائية والأسماء الإنجليزية والوحدات المختصرة (أمر شراء، RFQ، م.ط، القطاعات) إلى المشتري المنزلي بعد الإرسال: في التفاصيل والعروض والصفقة والإشعارات وواتساب.","الإجراء الرئيسي مخفي أو صامت: فقاعة المساعد البنفسجية تغطي زر الإرسال، وأخطاء التحقق تظهر في أعلى الصفحة بعيداً عن نظر المستخدم، وزر «تأكيد اختيار العروض» في آخر الصفحة، وأخطاء المورد على عرضه المُرسل لا تظهر.","الصفقة مقسومة بين صفحتين، وإجمالياتها متضاربة: قبل الضريبة وبعدها، والرسوم الإضافية، والترسية الجزئية. التأكيد الجزئي يغلق الطلب دون تحذير، وزر «حذف الكل» يمسح عروضاً ما زال يمكن اختيارها.","طرق مسدودة في الدخول والحساب: دعوة الفريق تطلب سجلاً تجارياً، واستعادة كلمة المرور تفشل على جهاز آخر، وشاشات التوثيق والإيقاف بلا خروج، وبانر البريد يطارد مشتري الجوال ولا يُغلق، وفي الإعدادات أسماء مقفلة ورقم بريد وهمي."],"items":[{"id":"UX-001","severity":"critical","persona":"supplier","surface":"both","category":"privacy","screen":"تفاصيل العرض: شارة المحل المصدر (عند المشتري)","where":"web/src/components/rfq/SourceShop.tsx:112-115; migration 248 get_offer_source","problem_ar":"يظهر اسم المحل المصدر لعرض وسيط التسعير بمجرد اختيار مادة واحدة، قبل أي تأكيد. يستطيع المشتري الاطلاع على الاسم ثم إلغاء الاختيار والشراء من المحل مباشرة. والشارة ما زالت تعرض الهاتف إن أرجعه الإجراء. هذا يخالف قاعدة «اسم المحل بعد الصفقة فقط».","fix_ar":"في هجرة جديدة لـget_offer_source: اجعل فرع المشتري v_deal := (status = 'accepted') فقط، واحذف شرط وجود rfq_item_awards. في SourceShopBadge احذف فرع d.phone من واجهة المشتري. أضف فحصاً في e2e_deal_flow: بعد award وقبل finalize يجب أن يعيد الإجراء revealed=false.","effort":"S","batch":1},{"id":"UX-002","severity":"critical","persona":"supplier","surface":"web","category":"privacy","screen":"صفحة الصفقة: أمر الشراء المطبوع لوسيط التسعير","where":"web/src/components/rfq/SourceShop.tsx:115; web/src/app/(dashboard)/contractor/orders/[id]/page.tsx:160","problem_ar":"يرى الوسيط «البائع (المحل المصدر): الاسم · الهاتف» داخل أمر الشراء، وزر «طباعة أمر الشراء» يطبع الهاتف. إذا سلّم الوسيط الملف للمشتري وصل إليه هاتف المحل. وتقول العبارة «تصدر من هذا المحل باسمك» وهي مكتوبة للمشتري لا للوسيط.","fix_ar":"احذف الهاتف من الشارة نهائياً، فهو يظهر للوسيط في SourceShopCard. إن أُبقي فليكن داخل print:hidden. عندما يُرجَع الهاتف (أي أن العارض هو البائع) استخدم العبارة «تصدر الفاتورة الضريبية من هذا المحل باسم المشتري.»","effort":"S","batch":1},{"id":"UX-003","severity":"critical","persona":"everyone","surface":"both","category":"privacy","screen":"صفحة الموردين العامة /suppliers وملف المورد","where":"web/src/app/suppliers/[id]/page.tsx:56; SuppliersDirectory.tsx:95; migrations 103/156 get_supplier_leaderboard/get_supplier_public","problem_ar":"الصفحة العامة تعرض «Test Supplier» وحده بشارة «✓ موثّق» وبدرجة 32. وتنشر أسماء وسطاء أفراد ومدنهم لكل زائر ولمحركات البحث، وهذا خطر على PDPL. ولا يستبعد get_supplier_public الحسابات التجريبية ولا المحظورة ولا المحذوفة. ويحصل الوسيط على شارة «موثّق» مع أنه بلا سجل تجاري.","fix_ar":"1) اضبط is_test=true للحسابات التجريبية. 2) في هجرة جديدة أضف للإجراءين: not is_test، وis_active، وعدم الحظر، وsupplier_tier \u003c> 'independent'، أو اعرض «وسيط تسعير» دون الاسم. 3) لا تمنح «موثّق» إلا لمنشأة verified ليست وسيطاً. 4) أبقِ حالة «قريباً» واحذف رابط «الموردون» من الرأس والتذييل حتى يوجد موردون حقيقيون.","effort":"S","batch":1},{"id":"UX-004","severity":"critical","persona":"everyone","surface":"app","category":"legal","screen":"الإعدادات ← حذف حسابي","where":"app/src/app/settings/delete.tsx:83-85; app/src/app/settings/index.tsx:42","problem_ar":"تقول الصفحة إن «طلباتك وعروضك وأسعارك ورسائلك» ستُحذف. لكن delete_my_account يجعل الحساب مجهول الهوية: يلغي الطلبات المفتوحة ويُبقي الصفقات والرسائل لدى الطرف الآخر. هذا إفصاح مضلّل يخالف ما في الموقع وسياسة الخصوصية، والنص الأردي مبتور.","fix_ar":"انسخ قوائم الموقع /account/delete حرفياً بالعربية والإنجليزية والأردية. تحت «ما الذي يُحذف» ضع: الاسم والجوال والعنوان والمستندات والمسودات والإشعارات وبيانات الدخول. تحت «ما الذي يتغيّر» ضع «تُلغى طلباتك المفتوحة وعروضك المعلّقة». تحت «ما الذي يُحتفظ به» ضع: «سجلّات الصفقات المكتملة (أوامر الشراء والفواتير والمراسلات) تبقى لدى الطرف الآخر باسم «حساب محذوف»». غيّر العنوان الفرعي في الإعدادات إلى «حذف بياناتك الشخصية نهائياً، مع بقاء الصفقات دون هويتك». الأفضل نقل القوائم إلى وحدة مشتركة.","effort":"S","batch":1},{"id":"UX-005","severity":"high","persona":"home_buyer","surface":"both","category":"bug","screen":"«جهّز بيتك» ← قائمة الحزمة (PackSheet)","where":"web/src/lib/homePacks.ts:46,47,91,92,117,120,124; PackSheet.tsx:24 (web) و:25 (app)","problem_ar":"الوحدة المعروضة بجانب الكمية تناقض التلميح. التلميح يطلب المتر المربع والوحدة «جالون»، ويطلب عرض النافذة والوحدة «متر مربع»، ويطلب «اكتب العدد» والوحدة م². فيرسل المشتري «40 جالون دهان أساس» أو «20 لفة ورق جدران»، ويسعّر الموردون كميات خاطئة.","fix_ar":"أضف unit اختيارياً إلى PackItem، واستخدم it.unit || getDefaultUnit(...). الدهان الأساسي: جالون، والتلميح «جالون لكل 30 م² تقريباً». المعجون: «سطل». ستائر القماش والمكتبة: «م.ط» وتُعرض «متر طولي». الستائر الرول والشرائح: م² والتلميح «اجمع مساحة النوافذ: العرض × الارتفاع بالمتر». ورق الجدران: لفة والتلميح «لفة لكل 5 م² تقريباً». أضف فحصاً آلياً يتأكد من توافق التلميح مع الوحدة، ثم شغّل sync-shared.","effort":"S","batch":1},{"id":"UX-006","severity":"high","persona":"everyone","surface":"web","category":"mobile","screen":"فقاعة المساعد الذكي فوق شريط الإرسال وسائر الصفحات","where":"web/src/components/shared/AiAssistant.tsx:46-96; rfq/quick/page.tsx:1048; supplier/dashboard/rfq/[id]/page.tsx:1728; specialties/page.tsx:379; contractor/rfq/[id]/page.tsx:1018-1029","problem_ar":"على الجوال تجلس الفقاعة البنفسجية (z-60، bottom 84px) فوق الثلث الأيسر من زر «أرسل طلب التسعير» وزر «إرسال العرض» وزر «حفظ التخصصات» وفوق نوافذ الدليل والمراجعة، فيفتح اللمس المحادثة بدل الإرسال. ولونها البنفسجي، وكذلك بطاقة «حلّل العروض» البنفسجية، يكسر الهوية.","fix_ar":"أخفِ الفقاعة أو ارفعها عندما يوجد شريط إجراء ثابت، عبر خاصية hideAssistant في AppShell أو العلامة body.dataset.actionbar. اخفض طبقتها إلى z-[45] لتغطيها النوافذ. لوّن الزر والرأس بالكحلي #0B2438 مع حلقة ذهبية وأيقونة Sparkles ذهبية، واجعل حدّ التركيز ذهبياً، واقلب أيقونة الإرسال في RTL. اجعل زر «حلّل العروض واقترح الأفضل» كحلياً وبطاقته بلمسة ذهبية. أضف print:hidden.","effort":"S","batch":1},{"id":"UX-007","severity":"high","persona":"all_buyers","surface":"web","category":"feedback","screen":"طلب التسعير: زر الإرسال وأخطاء التحقق","where":"web/src/app/(dashboard)/contractor/rfq/quick/page.tsx:437-485,711,513-532","problem_ar":"عند الضغط على «أرسل طلب التسعير» يُكتب الخطأ (مواصفات ناقصة، أو قسم مادة مكتوبة يدوياً، أو المنطقة) في صندوق بأعلى الصفحة دون تمرير إليه. ولا يحسب `ready` وsendHint هذين الشرطين، فيبدو أن الزر لا يفعل شيئاً. أخطاء رفع الملفات تذهب إلى المكان المخفي نفسه.","fix_ar":"اجعل validate() يعيد مفتاح ا فحة الصفقة، لأن مجموع الترسية لا يشمل الرسوم الإضافية. وفي التطبيق تجمع لوحة المورد total_price الكامل للعروض المقبولة جزئياً، فتتضخم «قيمتها» و«إجمالي المبيعات».","fix_ar":"أنشئ src/lib/dealTotal.ts المشترك: مجموع الترسية مضافاً إليه الرسوم الإضافية ما دامت extras_pending=false، مع منطق الضريبة نفسه. استخدمه في صفقاتي وصفحة الصفقة والتطبيق. أضف withAwardedTotals إلى useSupplierFeed كما يفعل الموقع، وغيّر تسمية البلاطة إلى «قيمة الصفقات (ر.س)».","effort":"S","batch":1},{"id":"UX-019","severity":"high","persona":"all_buyers","surface":"both","category":"bug","screen":"بطاقة العرض والملخص: الضريبة والإجمالي","where":"web rfq/[id]/page.tsx:694,905,960-962,1126-1177; offer/[offerId]:273,318; app OfferCard.tsx:146-153","problem_ar":"في البطاقة الواحدة إجماليان مختلفان بنحو 15%: الرقم الكبير يشمل الضريبة، و«الإجمالي» في صندوق الرسوم قبلها. والبائع غير المسجّل يظهر تحت «سعر نهائي، لا تُضاف إليه ضريبة» عنده «قبل الضريبة 1,000». والملخص يقول «الضريبة 15% 0 ر.س». والمشتري المنزلي يرى رقمين ووسماً ضريبياً.","fix_ar":"صندوق الرسوم: «المجموع قبل الضريبة» ثم سطر عريض فيه totalLabel وofferComparable. عنوان عمود البنود «السعر قبل الضريبة» أو «شاملاً الضريبة». الشريط المقبول يعرض offerComparable مع vatTag. شرط سطر «قبل الضريبة» يصبح showsVatBreakdown && !vat_included. الملخص: يُخفى السطر إن كان الجميع بلا ضريبة، وفي الحالة المختلطة: «منها ضريبة القيمة المضافة X ر.س على عروض الموردين المسجّلين فقط». للمشتري المنزلي رقم واحد «المبلغ الذي تدفعه» مع vatTag، و«يشمل التوصيل X ر.س».","effort":"S","batch":1},{"id":"UX-020","severity":"high","persona":"all_buyers","surface":"web","category":"bug","screen":"طلباتي: طلبات انتهت مهلتها وفيها عروض","where":"web/src/app/(dashboard)/contractor/rfqs/page.tsx:68,91,94,122,145,162,233","problem_ar":"يوضع الطلب المفتوح الذي انتهت مهلته تحت «منتهية» مع شارة «يُحذف في…»، مع أن عروضه ما زالت قابلة للاختيار 30 يوماً. وضغطة واحدة على «حذف الكل» تمسح هذه العروض ومحادثاتها نهائياً.","fix_ar":"أضف حالة 'choose' (مفتوح، انتهت مهلته، عدد العروض أكبر من صفر) بشا إجراء واعرض ErrorRetry. أضف زر «تسجيل الخروج والدخول بحساب آخر»، و«ستنضم بحساب: {الاسم}»، ورابط رجوع للدعوة غير الصالحة.","effort":"M","batch":1},{"id":"UX-028","severity":"high","persona":"supplier","surface":"web","category":"feedback","screen":"صفحة التسعير: عرض مُرسل (خصم، سؤال، إلغاء، مراسلة)","where":"web supplier/dashboard/rfq/[id]/page.tsx:125,138,151,845,896,1047,1054,1061","problem_ar":"أخطاء submitReduction وcancelOffer وsubmitInfoResponse و«راسل المشتري» تُكتب في عنصر لا يظهر إلا مع نموذج التسعير المفتوح. فإذا فشل السعر الجديد في مهلة الخصم توقّف المؤشر ولم يظهر شيء، وظن المورد أنه أُرسل.","fix_ar":"اعرض تنبيهاً أحمر (role=alert) فوق سلسلة الحالات كلما كان النموذج مغلقاً، وامسح الخطأ في بداية كل إجراء. قبل الإرسال تحقّق محلياً: «يجب أن يكون السعر الجديد أقل من سعرك الحالي.»","effort":"S","batch":1},{"id":"UX-029","severity":"high","persona":"supplier","surface":"both","category":"bug","screen":"التسعير: «الأسعار قبل الضريبة» مقابل التلميحات","where":"web supplier rfq/[id]/page.tsx:1093,1264,1530-1547; app PricingParts.tsx:193,384-386; app supplier/rfq/[id].tsx:716,736","problem_ar":"إذا اختار المسجّل «قبل الضريبة» بقي التلميح يقول «شاملاً ضريبة القيمة المضافة 15%» للسعر والتركيب، ثم تُضاف 15% فوق الكل فيدفع المشتري ضريبة التركيب مرتين. وفي التطبيق تقسم BuyerBudget السعر الصافي على 1.15 فلا تُكتشف تجاوزات الميزانية. وزر الاختيار يقع تحت كل البطاقات على الجوال.","fix_ar":"اجعل التلميحات ثلاثية: بلا ضريبة / شامل / «قبل الضريبة، وتُضاف 15% للمشتري». تلميح التركيب للصافي: «مبلغ التركيب للكمية كاملة قبل الضريبة؛ اكتب 0 إن كان مشمولاً.» مرّر vatIncluded إلى ItemPriceCard وBuyerBudget. انقل ملاحظة الضريبة وزرّيها إلى أعلى، تحت «سعّر المواد التي تستطيع توفيرها».","effort":"S","batch":1},{"id":"UX-030","severity":"high","persona":"supplier","surface":"both","category":"flow","screen":"المشتري ينتظر ردّ المورد (خصم أو سؤال)","where":"web supplier/dashboard/page.tsx:336,652; supplier rfq/[id]:1012-1037; app supplier/rfq/[id].tsx:1055; offers.tsx:99","problem_ar":"طلب الخصم بمهلة هو أكثر إجراءات المورد إلحاحاً، ولا يظهر عنه إلا «•» صغيرة على تبويب غير افتراضي. وصندوقه يقع تحت قائمة المواد كلها، والحقل بلا تسمية، ولا يوجد خيار «لا أستطيع التخفيض».","fix_ar":"أضف بطاقة فوق البطل: «المشتري ينتظر ردّك على {عرض واحد/عرضين/N عروض}»، وفيها صف لكل عرض «طلب المشتري خصماً — المهلة حتى {الوقت}» أو «سؤال من المشتري»، مع زر ذهبي «ردّ الآن». افتح «عروضي» افتراضياً عند وجود انتظار. انقل صندوقَي الخصم والسؤال تحت الحالة مباشرة، مع «باقي {الوقت} للرد»، وتسمية «السعر الإجمالي الجديد (أقل من X ر.س)»، وتحقق فوري، وزر كحلي «لا أستطيع التخفيض» يفتح المحادثة برسالة جاهزة. لوّن شارة الخصم بالذهبي لا بالأحمر.","effort":"M","batch":1},{"id":"UX-031","severity":"high","persona":"supplier","surface":"both","category":"flow","screen":"«التعديل خلال 15 دقيقة»","where":"web supplier rfq/[id]/page.tsx:659,1003-1007,1710; app supplier/rfq/[id].tsx:628,902,958-968,1048","problem_ar":"الصفحة تَعِد بالتعديل، والمتاح فقط «إلغاء وإعادة التسعير». المسودة تُحذف عند الإرسال، فيعود النموذج فارغاً ويضيع التوصيل والضريبة والتركيب والمواصفات والملاحظات. من يكتشف خطأً واحداً في 20 مادة يعيد بناء العرض أو يترك الخطأ.","fix_ar":"قبل cancel_my_offer اكتب مسودة مبنية من العرض الحالي (الأسعار، والمواصفات، والتوصيل، وvat_included، والإضافات، والمصدر، والمحل)، أو احتفظ بالمسودة مع sentAt لعشرين دقيقة. سمِّ الزر «تعديل العرض» بالكحلي لا بالأحمر. النص: «يمكنك تعديل عرضك خلال 15 دقيقة من إرساله، وتبقى أسعارك وتفاصيلك كما هي.» وإن تعذّرت استعادة المرفقات قل: «أعد إرفاق الملفات».","effort":"M","batch":1},{"id":"UX-032","severity":"high","persona":"supplier","surface":"web","category":"mobile","screen":"صفحة التسعير على الجوال","where":"web supplier rfq/[id]/page.tsx:593,802,840,1439,1501,1539,1704-1707,1733-1735","problem_ar":"على الجوال تأتي حقائق الطلب (الموقع، التوصيل، ملاحظات المشتري، المهلة) والحقول الإلزامية (تكلفة التوصيل، الضريبة، اسم المحل) بعد كل البطاقات. وسبب تعطّل الزر «حدّد تكلفة التوصيل» نص لا يُضغط، وفحص اسم المحل يأتي بعد الرفع والتأكيد.","fix_ar":"أضف شريطاً مضغوطاً
